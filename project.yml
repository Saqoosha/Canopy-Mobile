packages:
  # Same package Pager renders its history with. A notification body is the
  # assistant's own message, so it arrives as Markdown; SwiftUI's built-in
  # AttributedString(markdown:) handles inline styling only and drops
  # headings, lists and fenced code, which is most of what these bodies are.
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.0.0
name: CanopyMobile
options:
  bundleIdPrefix: sh.saqoo
  deploymentTarget:
    iOS: "18.0"
targets:
  CanopyMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - CanopyMobileNotificationService/**
    entitlements:
      path: Sources/CanopyMobile.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups:
          - group.sh.saqoo.canopy-app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.saqoo.canopy-app
        INFOPLIST_KEY_CFBundleDisplayName: Canopy
        DEVELOPMENT_TEAM: VCFY2GFR89
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # xcodegen auto-detects an Info.plist anywhere under a target's source
        # paths and sets INFOPLIST_FILE from it — the `excludes` above does not
        # stop that scan. Left alone it hands this app the notification
        # extension's plist, which lands NSExtension in the app bundle and
        # drops GENERATE_INFOPLIST_FILE's keys, app icon included. Blanking it
        # puts the generated plist back.
        INFOPLIST_FILE: ""
        # The extension's own Info.plist already carries this key; the app
        # generates its plist, so it needs the INFOPLIST_KEY_ form. Without it
        # every TestFlight upload stops to ask the export-compliance question
        # by hand. False is accurate: the app uses URLSession HTTPS and the
        # Keychain, both Apple-provided — revisit if it ever ships crypto of
        # its own.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # App Store validation rejects a bundle that declares no orientations
        # (error 90474) whenever TARGETED_DEVICE_FAMILY includes iPad, because
        # iPad multitasking needs all four. The generated Info.plist carries
        # none by default, so the archive uploads clean and Apple fails it
        # server-side — the local build only warns. iPhone stays portrait-only,
        # which is what the UI is built for; iPad declares all four purely to
        # satisfy that rule. Same split Pager uses.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    dependencies:
      - target: CanopyMobileNotificationService
      - package: MarkdownUI

  # A Notification Service Extension. Apple has no distinct product type for
  # it — `app-extension` is the same product type Xcode's own NSE template
  # uses; the NSE identity comes from Info.plist's NSExtensionPointIdentifier
  # (com.apple.usernotifications.service) below, not from the target type.
  # Pure-logic unit tests. A host application is deliberately not set: these
  # exercise value types only, and a hosted bundle would need a simulator to
  # launch the app before running a string transform.
  CanopyMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: CanopyMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.saqoo.canopy-app.tests
        DEVELOPMENT_TEAM: VCFY2GFR89
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

  CanopyMobileNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - Sources/CanopyMobileNotificationService
      - Sources/Shared
    entitlements:
      path: Sources/CanopyMobileNotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - group.sh.saqoo.canopy-app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.saqoo.canopy-app.NotificationService
        DEVELOPMENT_TEAM: VCFY2GFR89
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        INFOPLIST_FILE: Sources/CanopyMobileNotificationService/Info.plist

schemes:
  CanopyMobile:
    build:
      targets:
        CanopyMobile: all
    test:
      targets:
        - CanopyMobileTests
