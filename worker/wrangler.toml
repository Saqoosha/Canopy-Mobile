name = "canopy-mobile-relay"
main = "src/index.ts"
# Capped by the workerd build @cloudflare/vitest-pool-workers bundles for
# local tests, not by anything in this code. Check that pin before raising
# this date.
compatibility_date = "2026-08-22"

[observability]
enabled = true
head_sampling_rate = 1.0

[[durable_objects.bindings]]
name = "MACHINE"
class_name = "MachineDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MachineDO"]

# The phone cannot enumerate Durable Objects, so this records every machine
# id that has ever published. Real id NOT created by this change — run
# `npx wrangler kv namespace create MACHINES` and paste the id it prints.
[[kv_namespaces]]
binding = "MACHINES"
id = "PLACEHOLDER-run-wrangler-kv-namespace-create-MACHINES"
