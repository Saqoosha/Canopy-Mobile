name = "canopy-mobile-relay"
main = "src/index.ts"
# Capped by the workerd build @cloudflare/vitest-pool-workers bundles for
# local tests, not by anything in this code. Check that pin before raising
# this date.
compatibility_date = "2026-08-22"
# Same account as pager-relay; pinned so a deploy never prompts to pick one.
account_id = "0f56ad2619afc619cc2975dd0728f8a9"

[observability]
enabled = true
head_sampling_rate = 1.0

[[durable_objects.bindings]]
name = "MACHINE"
class_name = "MachineDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MachineDO"]

# The phone cannot enumerate Durable Objects, so this records every machine
# id that has ever published. Created 2026-09-04 on Saqoosha's account; a
# fork needs its own (`npx wrangler kv namespace create MACHINES`).
[[kv_namespaces]]
binding = "MACHINES"
id = "34a34a05b2194af6b9f2c89847a57ea1"
